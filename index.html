<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>6. Contract Maze</title><style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#111;border:2px solid #0052FF;}</style></head>
<body>
<h1>6. Smart Contract Maze</h1>
<canvas id="c" width="250" height="250"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let px=20, py=20;
document.onkeydown = e => {
    if(e.key==='ArrowUp') py-=5; if(e.key==='ArrowDown') py+=5;
    if(e.key==='ArrowLeft') px-=5; if(e.key==='ArrowRight') px+=5;
};
function loop() {
    ctx.clearRect(0,0,250,250);
    ctx.fillStyle='#0052FF'; ctx.fillRect(px, py, 12, 12);
    ctx.fillStyle='#00D1FF'; ctx.fillRect(200, 200, 20, 20);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
